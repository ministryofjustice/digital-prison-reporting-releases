name: Raise release request

# Raises a PR that pins a helm_app project to a specific tag and environment.
# Merging the PR triggers helm_app_release.yml which dispatches the app's release.yml.
#
# GitHub-only (helm_app type). CircleCI data-platform projects are not supported.

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project Repo Name'
        type: choice
        required: true
        options:
          - hmpps-digital-prison-reporting-mi-ui
          - hmpps-dpr-tools-ui

      tag:
        description: 'App release tag (vX.Y.Z) — find it on the project Tags page, not Lib-v* tags'
        type: string
        required: true

      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - preprod
          - prod

permissions:
  contents: write        # push branch
  pull-requests: write   # open PR

jobs:
  raise-pr:
    name: 'Raise PR: ${{ inputs.project }} ${{ inputs.tag }} -> ${{ inputs.environment }}'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v4.2.2 — pinned SHA (MoJ policy).
        # Using RELEASES_GITHUB_TOKEN so the pushed branch can trigger workflows on merge
        # (pushes from GITHUB_TOKEN do not trigger other workflows by default).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASES_GITHUB_TOKEN }}

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate tag format
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' must be in vX.Y.Z format (e.g. v1.2.3)"
            exit 1
          fi

      - name: Verify tag exists in app repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT="${{ inputs.project }}"
          TAG="${{ inputs.tag }}"
          if ! gh api "repos/ministryofjustice/${PROJECT}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} not found in ministryofjustice/${PROJECT}"
            echo "Check the project Tags page — app release tags are vX.Y.Z."
            echo "Do not use Lib-v* tags (those track shared library versions, not app releases)."
            exit 1
          fi
          SHA=$(gh api "repos/ministryofjustice/${PROJECT}/commits/${TAG}" --jq .sha)
          echo "Verified: ${TAG} -> ${SHA}"

      - name: Resolve release file paths
        id: paths
        run: |
          set -euo pipefail
          PROJECT="${{ inputs.project }}"
          ENV="${{ inputs.environment }}"
          echo "release_path=${ENV}/${PROJECT}/release.yml"          >> "$GITHUB_OUTPUT"
          echo "config_path=${ENV}/${PROJECT}/config/values.yaml"    >> "$GITHUB_OUTPUT"
          echo "dir=${ENV}/${PROJECT}"                               >> "$GITHUB_OUTPUT"

      - name: Update or create release.yml
        run: |
          set -euo pipefail
          PROJECT="${{ inputs.project }}"
          TAG="${{ inputs.tag }}"
          ENV="${{ inputs.environment }}"
          RELEASE_PATH="${{ steps.paths.outputs.release_path }}"
          CONFIG_PATH="${{ steps.paths.outputs.config_path }}"
          DIR="${{ steps.paths.outputs.dir }}"

          mkdir -p "${DIR}/config"

          if [ -f "$RELEASE_PATH" ]; then
            # File already exists — update tag and environment with sed to preserve comments.
            # yq -i rewrites the whole file and strips comments; sed targets only these lines.
            sed -i "s|^\( *tag:\).*|\1 ${TAG}|"         "$RELEASE_PATH"
           #sed -i "s|^\( *environment:\).*|\1 ${ENV}|" "$RELEASE_PATH"

            # Bump counter (0-9, wraps) so a re-deploy of the same tag+env still produces a diff.
            # helm_app_release.yml ignores this field — it is purely a change trigger.
            CURRENT_BUMP=$(grep -E '^ *bump:' "$RELEASE_PATH" | grep -oE '[0-9]+' || true)
            if [ -z "$CURRENT_BUMP" ]; then
              NEXT_BUMP=0
              printf '  bump: %s\n' "$NEXT_BUMP" >> "$RELEASE_PATH"
            else
              NEXT_BUMP=$(( (CURRENT_BUMP + 1) % 10 ))
              sed -i "s|^\( *bump:\).*|\1 ${NEXT_BUMP}|" "$RELEASE_PATH"
            fi
            echo "Updated ${RELEASE_PATH}: tag=${TAG}, environment=${ENV}, bump=${NEXT_BUMP}"
          else
            # New project entry — create a minimal helm_app release stub.
            printf '%s\n' \
              "# Helm-app release pin for ${PROJECT}." \
              "# Managed by .github/workflows/helm_app_release.yml -- do not dispatch manually." \
              "release:" \
              "  type: helm_app" \
              "  project: ${PROJECT}" \
              "  tag: ${TAG}" \
              "  environment: ${ENV}" \
              "  workflow: release.yml" \
              "  verify_image: true" \
              "  bump: 0" \
              > "$RELEASE_PATH"
            echo "Created ${RELEASE_PATH}"

            # Create a matching empty config/values.yaml so the directory structure is consistent
            if [ ! -f "$CONFIG_PATH" ]; then
              printf '%s\n' \
                "# Optional Helm value overrides applied on top of the app chart's" \
                "# helm_deploy/values-<environment>.yaml during promote." \
                "# Leave empty (comments only) unless you need a one-off release override." \
                > "$CONFIG_PATH"
              echo "Created ${CONFIG_PATH}"
            fi
          fi

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT="${{ inputs.project }}"
          TAG="${{ inputs.tag }}"
          ENV="${{ inputs.environment }}"
          RELEASE_PATH="${{ steps.paths.outputs.release_path }}"
          CONFIG_PATH="${{ steps.paths.outputs.config_path }}"

          BRANCH="release/${ENV}/${PROJECT}/${TAG}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check for a stale branch or open PR from a previous run.
          EXISTING_PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url' 2>/dev/null || true)
          BRANCH_EXISTS=$(git ls-remote --heads origin "$BRANCH" | wc -l | tr -d ' ')

          if [ -n "$EXISTING_PR_URL" ]; then
            echo "::error::A release PR for this branch already exists and is open."
            echo "::error::Branch:  ${BRANCH}"
            echo "::error::PR:      ${EXISTING_PR_URL}"
            echo "::error::Please merge or close the existing PR before raising a new one."
            echo "::error::If you want to re-deploy, merge the existing PR or close it and re-run this workflow."
            exit 1
          fi

          if [ "$BRANCH_EXISTS" != "0" ]; then
            BRANCH_URL="https://github.com/ministryofjustice/digital-prison-reporting-releases/tree/${BRANCH}"
            echo "::error::A release branch already exists on the remote but has no open PR."
            echo "::error::Branch: ${BRANCH}"
            echo "::error::URL:    ${BRANCH_URL}"
            echo "::error::This usually means a previous PR was merged or closed without deleting the branch."
            echo "::error::Please delete the remote branch and re-run this workflow."
            exit 1
          fi

          git checkout -b "$BRANCH"
          git add "$RELEASE_PATH"

          # Stage config/values.yaml only if it was newly created
          if [ -f "$CONFIG_PATH" ]; then
            git add "$CONFIG_PATH"
          fi

          if git diff --cached --quiet; then
            echo "::notice::No changes — ${RELEASE_PATH} already pins ${TAG} to ${ENV}. No PR raised."
            exit 0
          fi

          git commit -m "chore(release): ${PROJECT} ${TAG} -> ${ENV}"
          git push origin "$BRANCH"

          # Write PR body to a temp file to avoid shell quoting issues
          PR_BODY_FILE=$(mktemp)

          if [ "$ENV" = "prod" ]; then
            printf '%s\n' \
              "## Release request" \
              "" \
              "> [!WARNING]" \
              "> **PRODUCTION release** -- this PR requires **2 approvals** before merging:" \
              "> 1. The raiser (you)" \
              "> 2. A second team member who did not raise this PR" \
              "" \
              "| Field | Value |" \
              "|-------|-------|" \
              "| **Project** | \`${PROJECT}\` |" \
              "| **Tag** | \`${TAG}\` |" \
              "| **Environment** | \`${ENV}\` |" \
              "" \
              "### What happens on merge" \
              "" \
              "1. \`helm_app_release.yml\` detects the changed \`${RELEASE_PATH}\`" \
              "2. Validates the tag \`${TAG}\` exists in \`ministryofjustice/${PROJECT}\`" \
              "3. Dispatches \`release.yml\` on \`${PROJECT}\` with \`environment=${ENV}\` and \`release-tag=${TAG}\`" \
              "4. App runs a **Helm-only promote** -- no Docker rebuild, image must already exist in GHCR" \
              "" \
              "### Checklist before merging" \
              "- [ ] Tag \`${TAG}\` is the correct app release tag (not a \`Lib-v*\` tag)" \
              "- [ ] The image for this tag exists in GHCR and has been validated in preprod" \
              "- [ ] Approved by the raiser" \
              "- [ ] Approved by a second team member (not the raiser)" \
              "- [ ] GitHub Environment approvals on \`${PROJECT}\` are in place" \
              "- [ ] No other release PR for \`${PROJECT}\` is currently open or in-flight" \
              > "$PR_BODY_FILE"
          else
            printf '%s\n' \
              "## Release request" \
              "" \
              "| Field | Value |" \
              "|-------|-------|" \
              "| **Project** | \`${PROJECT}\` |" \
              "| **Tag** | \`${TAG}\` |" \
              "| **Environment** | \`${ENV}\` |" \
              "" \
              "### What happens on merge" \
              "" \
              "1. \`helm_app_release.yml\` detects the changed \`${RELEASE_PATH}\`" \
              "2. Validates the tag \`${TAG}\` exists in \`ministryofjustice/${PROJECT}\`" \
              "3. Dispatches \`release.yml\` on \`${PROJECT}\` with \`environment=${ENV}\` and \`release-tag=${TAG}\`" \
              "4. App runs a **Helm-only promote** -- no Docker rebuild, image must already exist in GHCR" \
              "" \
              "### Checklist before merging" \
              "- [ ] Tag \`${TAG}\` is the correct app release tag (not a \`Lib-v*\` tag)" \
              "- [ ] The image for this tag exists in GHCR" \
              "- [ ] GitHub Environment approvals on \`${PROJECT}\` are in place if required" \
              "- [ ] No other release PR for \`${PROJECT}\` is currently open or in-flight" \
              > "$PR_BODY_FILE"
          fi

          # For prod: request review from the team so a second approver is notified.
          if [ "$ENV" = "prod" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Release: ${PROJECT} ${TAG} -> ${ENV}" \
              --body-file "$PR_BODY_FILE" \
              --reviewer "ministryofjustice/hmpps-digital-prison-reporting"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Release: ${PROJECT} ${TAG} -> ${ENV}" \
              --body-file "$PR_BODY_FILE"
          fi

          rm -f "$PR_BODY_FILE"
